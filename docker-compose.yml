services:
  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userdb
    volumes:
      - user_pg_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orderdb
    volumes:
      - order_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notificationdb
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d notificationdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres-user:5432/userdb
    depends_on:
      postgres-user:
        condition: service_healthy
    restart: on-failure

  order-service:
    build: ./order-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres-order:5432/orderdb
      NOTIFICATION_GRPC_HOST: notification-service
      NOTIFICATION_GRPC_PORT: 50051
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-service:
        condition: service_started
    restart: on-failure

  notification-service:
    build: ./notification-service
    ports:
      - "8131:8131"
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres-notification:5432/notificationdb
      GRPC_PORT: 50051
    depends_on:
      postgres-notification:
        condition: service_healthy
    restart: on-failure

  gateway:
    build: ./gateway
    ports:
      - "8090:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      NOTIFICATION_SERVICE_URL: http://notification-service:8131
    depends_on:
      - user-service
      - order-service
      - notification-service
    restart: on-failure

volumes:
  user_pg_data:
  order_pg_data:
  notification_pg_data:
