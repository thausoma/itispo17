name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install flake8

      - name: Run flake8
        run: |
          flake8 gateway/ user-service/ order-service/ notification-service/ \
            --max-line-length=120 --exclude=proto,*_pb2.py,*_pb2_grpc.py

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway
        run: |
          docker build -t week-17-gateway:latest ./gateway

      - name: Build User Service
        run: |
          docker build -t week-17-user-service:latest ./user-service

      - name: Build Order Service
        run: |
          docker build -t week-17-order-service:latest ./order-service

      - name: Build Notification Service
        run: |
          docker build -t week-17-notification-service:latest ./notification-service

      - name: List built images
        run: docker images | grep week-17

  compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: |
          docker-compose up -d --build
          sleep 30

      - name: Check all containers running
        run: |
          docker-compose ps
          docker-compose ps | grep -q "Up" || exit 1

      - name: Test Gateway health
        run: |
          curl -f http://localhost:8090/health || exit 1

      - name: Test User Service
        run: |
          curl -f -X POST http://localhost:8090/api/users \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test","email":"ci@test.com"}' || exit 1

      - name: Test Order Service
        run: |
          curl -f -X POST http://localhost:8090/api/orders \
            -H "Content-Type: application/json" \
            -d '{"user_id":1,"total":42.00}' || exit 1

      - name: Test Notifications
        run: |
          curl -f http://localhost:8090/api/notifications || exit 1

      - name: Test GraphQL
        run: |
          curl -f -X POST http://localhost:8090/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"query { users { id name email } orders { id status } notifications { id message } }"}' || exit 1

      - name: Test Circuit Breaker endpoint
        run: |
          curl -f http://localhost:8090/api/orders || exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker-compose logs

      - name: Tear down
        if: always()
        run: docker-compose down -v