apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: notifications-s19
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-notification 5432; do echo waiting for postgres-notification; sleep 2; done;']
      containers:
        - name: notification-service
          image: week-17-notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8131
              name: http
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://user:password@postgres-notification:5432/notificationdb"
          readinessProbe:
            httpGet:
              path: /health
              port: 8131
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8131
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: notifications-s19
spec:
  selector:
    app: notification-service
  ports:
    - port: 8131
      targetPort: 8131
      name: http
    - port: 50051
      targetPort: 50051
      name: grpc
  type: ClusterIP
