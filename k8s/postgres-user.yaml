apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-user
  namespace: notifications-s19
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "user"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "userdb"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "userdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: notifications-s19
spec:
  selector:
    app: postgres-user
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
