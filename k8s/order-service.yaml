apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: notifications-s19
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-order 5432; do echo waiting for postgres-order; sleep 2; done;']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
        - name: wait-for-notification
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z notification-service 50051; do echo waiting for notification-service gRPC; sleep 2; done;']
      containers:
        - name: order-service
          image: week-17-order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://user:password@postgres-order:5432/orderdb"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: notifications-s19
spec:
  selector:
    app: order-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
